# Telefon ilovasi: Android (APK) va iOS. Ilova serverdagi Web App ni ochadi, kirish va bildirishnomalar — Telegram botda.
#
# Sozlash (Settings → Secrets and variables → Actions):
#   Variables:  APP_SERVER_URL      — botdagi WEBAPP_URL bilan bir xil (masalan https://ilova.example.uz)
#   Secrets (Android imzosi — APK yangilanishlari eski ilova ustiga o'rnatilishi uchun SHART):
#               ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Secrets (iOS — App Store / TestFlight, ixtiyoriy):
#               IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROFILE_BASE64, IOS_TEAM_ID,
#               ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64
# Batafsil: mobile/README.md
name: Mobil ilova

on:
  push:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "APK ni GitHub Releases ga ham joylash"
        type: boolean
        default: true

permissions:
  contents: write

env:
  APP_SERVER_URL: ${{ vars.APP_SERVER_URL }}
  APP_BUILD: ${{ github.run_number }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Server manzili
        run: |
          [ -n "$APP_SERVER_URL" ] || APP_SERVER_URL=$(node -p "require('./app.json').serverUrl || ''")
          if [ -z "$APP_SERVER_URL" ]; then
            echo "::warning::Server manzili (mobile/app.json → serverUrl yoki APP_SERVER_URL) yo'q — sinov uchun https://example.org bilan yig'iladi (bu APK ishlamaydi)."
            APP_SERVER_URL=https://example.org
          fi
          echo "APP_SERVER_URL=$APP_SERVER_URL" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Android loyihasi
        run: npm run android
      - name: Yig'ish
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          if [ -n "$KS_B64" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            npx cap build android --androidreleasetype APK --signing-type apksigner \
              --keystorepath "$RUNNER_TEMP/release.jks" --keystorepass "$KS_PASS" \
              --keystorealias "$KS_ALIAS" --keystorealiaspass "$KEY_PASS"
            cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" dist/jidu-ota-ona.apk
          else
            echo "::warning::Imzo kaliti (ANDROID_KEYSTORE_*) sozlanmagan — debug APK. U o'rnatiladi, lekin keyingi versiyalar uning ustiga o'rnatilmaydi. mobile/README.md ga qarang."
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/jidu-ota-ona.apk
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: jidu-ota-ona-android-${{ github.run_number }}
          path: mobile/dist/jidu-ota-ona.apk
      # Imzolangan APK — GitHub Releases ga: bot uni 6 soatda bir tekshirib, o'zi oladi (APP_RELEASES_REPO)
      - name: GitHub Releases
        if: env.SIGNED == '1' && env.APP_SERVER_URL != 'https://example.org' && (github.event_name == 'push' || inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-1.0.${APP_BUILD}" dist/jidu-ota-ona.apk --latest \
            --title "Android ilova 1.0.${APP_BUILD}" --target "${GITHUB_SHA}" \
            --notes "Bot bu faylni avtomatik oladi (6 soat ichida yoki qayta ishga tushganda). Qo'lda: APK ni super-admin sifatida botga yuboring."

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # -eo pipefail: «xcodebuild | tail» xatoni yashirmasin
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4   # macOS da npm keshini saqlash qotib qolardi — keshsiz
        with:
          node-version: 22
      - name: Server manzili
        run: |
          [ -n "$APP_SERVER_URL" ] || APP_SERVER_URL=$(node -p "require('./app.json').serverUrl || ''")
          if [ -z "$APP_SERVER_URL" ]; then
            echo "::warning::Server manzili yo'q — sinov uchun https://example.org bilan yig'iladi."
            APP_SERVER_URL=https://example.org
          fi
          echo "APP_SERVER_URL=$APP_SERVER_URL" >> "$GITHUB_ENV"
      - run: npm ci
      - name: iOS loyihasi
        run: npm run ios
      - name: Tekshiruv uchun yig'ish (simulyator, imzosiz)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: App Store / TestFlight (imzo sozlangan bo'lsa)
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILE" ] || [ -z "$TEAM_ID" ]; then
            echo "iOS imzosi sozlanmagan — App Store/TestFlight bosqichi o'tkazib yuborildi (mobile/README.md)."
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"; KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KC"; security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" MARKETING_VERSION="1.0.$APP_BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$NAME" archive | tail -20
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>uz.jidu.otaona</key><string>$NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath dist
          ls -la dist
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            mkdir -p ~/.appstoreconnect/private_keys
            echo "$ASC_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_"$ASC_KEY_ID".p8
            xcrun altool --upload-app -f dist/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
            echo "TestFlight ga yuklandi — App Store Connect da tekshiruvdan so'ng havolani botga /ilova_ios bilan kiriting."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jidu-ota-ona-ios-${{ github.run_number }}
          path: mobile/dist/*.ipa
          if-no-files-found: ignore
