<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aloqa yo'q</title><script src="config.js"></script><script src="app.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E2240;color:#F3F6FC;
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
       padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
  main{width:100%;max-width:420px}
  .seal{width:72px;height:72px;border-radius:50%;background:#7D1D3F;display:grid;place-items:center;margin:0 auto 18px;
        font:700 34px Georgia,serif;box-shadow:0 0 0 4px rgba(255,255,255,.85) inset}
  h1{font:700 22px Georgia,serif;margin:0 0 8px}p{margin:0 0 18px;color:#B9C3D9}
  button,.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font:600 16px system-ui,sans-serif;
         background:#fff;color:#0E2240;margin:0 0 10px;text-decoration:none}
  .ghost{background:rgba(255,255,255,.12);color:#fff}
  details{margin-top:14px;text-align:left;background:rgba(255,255,255,.06);border-radius:14px;padding:12px 14px}
  summary{cursor:pointer;font-weight:600}
  input{width:100%;border:0;border-radius:12px;padding:12px;font:15px system-ui,sans-serif;margin:10px 0}
  .err{color:#FFB4C2;font-size:14px;min-height:20px}
  small{color:#8EA0C4}
</style></head>
<body><main>
  <div class="seal">J</div>
  <h1>Server bilan aloqa yo'q</h1>
  <p>Internetni tekshirib, qayta urinib ko'ring. Agar internet bor bo'lsa — ilova manzili o'zgargan bo'lishi mumkin.</p>
  <button onclick="JIDU.launch()">Qayta urinish</button>
  <button class="ghost" id="ask">Telegram'dan yangi manzilni olish</button>
  <details id="box"><summary>Yangi manzilni joylash</summary>
    <small>Botdan kelgan manzilni (https://…) shu yerga joylang:</small>
    <input id="url" type="url" inputmode="url" autocomplete="off" placeholder="https://…">
    <div class="err" id="err"></div>
    <button id="save">Saqlash</button>
  </details>
  <p style="margin-top:18px"><small>Нет связи с сервером · No connection to the server</small></p>
</main>
<script>
  var bot = JIDU.store.get('bot');
  document.getElementById('ask').onclick = function () {
    document.getElementById('box').open = true;
    // t.me havolasi ilovadan tashqarida — Telegram'da ochiladi; bot joriy manzilni yuboradi
    if (bot) location.href = 'https://t.me/' + bot + '?start=url';
    else document.getElementById('err').textContent = "Botga /manzil deb yozing va kelgan manzilni shu yerga joylang.";
  };
  document.getElementById('save').onclick = function () {
    var v = JIDU.normalize(document.getElementById('url').value);
    if (!v) { document.getElementById('err').textContent = "Manzil noto'g'ri. Botdan kelgan https://… manzilni to'liq joylang."; return; }
    JIDU.store.set('server', v);
    location.replace('index.html');
  };
  addEventListener('online', function () { JIDU.launch(); });
</script>
</body></html>
